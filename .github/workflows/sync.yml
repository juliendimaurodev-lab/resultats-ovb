name: Synchro FFVolley

on:
  schedule:
    - cron: '0 */2 * * *'      # toutes les 2 h (heure UTC)
    - cron: '15 * * * 6,0'     # + toutes les heures le week-end
  workflow_dispatch: {}        # lancement manuel possible

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lire les pages FFVolley
        run: node scripts/sync.mjs
      - name: Enregistrer les données modifiées
        if: always()
        run: |
          git config user.name "ffvb-bot"
          git config user.email "ffvb-bot@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || (git commit -m "Mise à jour des résultats" && git push)
